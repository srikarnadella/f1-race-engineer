[project]
name = "undercut-ml"
version = "0.1.0"
description = "Trains Undercut's models from the race store and the committed datasets, and exports them for the app to run (Python learns, Node runs)."
requires-python = ">=3.10"
# Pinned the same as requirements.txt, which is what the notes and the docs install from.
dependencies = [
  "lightgbm==4.5.0",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["undercut_ml*"]
