# Builds the Windows installer when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0) and
# attaches it to the GitHub release of that tag. It is unsigned, so Windows SmartScreen still warns (docs/setup.md).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: The tag must be the package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # --publish never: electron-builder would otherwise publish by itself on a tag when a token is present.
      - run: npm run app:build -- --publish never
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A copy with no version in its name, so releases/latest/download/Undercut-Setup.exe never changes.
          cp "dist/Undercut-Setup-$version.exe" dist/Undercut-Setup.exe
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/Undercut-Setup-$version.exe" dist/Undercut-Setup.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/Undercut-Setup-$version.exe" dist/Undercut-Setup.exe --title "Undercut $version for Windows" --generate-notes
          fi
