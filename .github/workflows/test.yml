# Tests on every branch and pull request (the Pages workflow only runs on main).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails below the coverage measured when the gate went in (lines 90.7%, branches 86.5%).
      - run: npm run test:coverage
